name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@060eae1f8226ee2de1e77d3f29dfa85d874d4eb8

      - name: Run Biome
        run: biome ci .
